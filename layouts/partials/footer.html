{{ $r := hugo.Data.restaurant }}
<footer class="flex-shrink-0 py-3 px-6 text-center text-xs border-t"
        style="background: var(--color-bg-sand); border-color: rgba(100,47,50,0.2); color: rgba(100,47,50,0.6);">
  <div class="max-w-screen-xl mx-auto flex items-center justify-center gap-6">
    <span>© {{ now.Year }} {{ $r.naam }}</span>
    <a href="{{ $r.instagram_url }}" target="_blank" rel="noopener"
       class="no-underline hover:opacity-75 transition-opacity font-bold"
       style="color: var(--color-primary-burgundy);">
      📸 @{{ $r.instagram_handle }}
    </a>
  </div>
</footer>
