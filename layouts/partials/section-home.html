{{ $r := hugo.Data.restaurant }}
<section id="section-home" class="site-section active flex-col"
         style="background: var(--color-bg-sand);">

  <div class="flex-1 relative flex flex-col items-center justify-center text-center px-6 py-8 overflow-hidden"
       style="min-height: 0;">

    <div class="slideshow-bg absolute inset-0">
       <div class="slide active" style="background-image: url('/images/instagram/post1.jpg?v=2');"></div>
      <div class="slide-overlay absolute inset-0"></div>
    </div>

    {{ with site.Data.restaurant.ribbon_tekst }}
    <div class="corner-ribbon-wrapper absolute top-0 left-0 w-48 h-48 overflow-hidden z-20 pointer-events-none">
      <div class="corner-ribbon absolute text-center uppercase tracking-widest font-black"
           style="background: var(--color-bg-sand); color: var(--color-primary-burgundy); font-family: var(--font-title);">
        {{ . }}
      </div>
    </div>
    {{ end }}

    <div class="relative z-10 max-w-screen-xl mx-auto w-full flex flex-col items-center justify-center my-auto">
  
      <h1 class="text-7xl md:text-9xl font-black mb-12 leading-none tracking-tighter"
          style="font-family: var(--font-title); color: var(--color-bg-sand);">
        {{ $r.naam }}
      </h1>
      <a href="#section-menu" data-section="menu"
         class="inline-block px-8 py-3 text-sm font-bold rounded transition-opacity hover:opacity-90 no-underline btn-primary"
         style="background: var(--color-primary-burgundy); color: white !important; -webkit-tap-highlight-color: transparent;">
        Bekijk het menu →
      </a>
    </div>
  </div>

  <div class="flex-shrink-0 flex border-t-4"
       style="border-color: var(--color-primary-burgundy);">
    <div class="max-w-screen-xl mx-auto w-full flex divide-x" style="divide-color: rgba(0,0,0,0.08);">
      <div class="flex-1 flex flex-col items-center py-4 px-4 text-center">
        <span class="text-xs font-bold uppercase tracking-wide mb-1"
              style="color: var(--color-primary-burgundy);">Open</span>
        <span class="text-sm" style="color: var(--color-text-dark);">Hele middag &amp; avond</span>
      </div>
      <div class="flex-1 flex flex-col items-center py-4 px-4 text-center">
        <span class="text-xs font-bold uppercase tracking-wide mb-1"
              style="color: var(--color-primary-burgundy);">Locatie</span>
        <span class="text-sm" style="color: var(--color-text-dark);">
          {{ $r.adres }}, {{ $r.stad }}
        </span>
      </div>
      <div class="flex-1 flex flex-col items-center py-4 px-4 text-center">
        <span class="text-xs font-bold uppercase tracking-wide mb-1"
              style="color: var(--color-primary-burgundy);">Reserveer</span>
        <a href="#tebi-reservations" class=
        "text-sm font-bold no-underline"
           style="color: var(--color-primary-burgundy);">
          Online Reserveren
        </a>
      </div>
    </div>
  </div>

</section>
