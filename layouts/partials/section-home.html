{{ $r := hugo.Data.restaurant }}
<section id="section-home" class="site-section active flex-col"
         style="background: var(--color-bg-sand);">

  <div class="flex-1 flex flex-col items-center justify-center text-center px-6 py-8"
       style="background: linear-gradient(160deg, var(--color-primary-burgundy) 0%, var(--color-text-dark) 100%); min-height: 0;">    <div class="max-w-screen-xl mx-auto w-full flex flex-col items-center">
      <img
        src="/images/West - Beeldmerk/Beeldmerk - SVG/West -Beeldmerk - Creme.svg"
        alt="West restaurant"
        class="w-24 h-24 mb-6 opacity-90"
      />
      <h1 class="text-6xl md:text-8xl font-black mb-3 leading-none"
          style="font-family: var(--font-title); color: var(--color-bg-sand);">
        {{ $r.naam }}
      </h1>
      <p class="text-lg mb-8 italic"
         style="font-family: var(--font-heading); color: rgba(205,182,132,0.75);">
        Italiaans in Rotterdam West
      </p>
      <a href="#menu" data-nav="menu"
         class="inline-block px-8 py-3 text-sm font-bold rounded transition-opacity hover:opacity-90 no-underline"
         style="background: var(--color-primary-burgundy); color: white;">
        Bekijk het menu →
      </a>
    </div>
  </div>

  <div class="flex border-t-4"
       style="border-color: var(--color-primary-burgundy);">
    <div class="max-w-screen-xl mx-auto w-full flex divide-x" style="divide-color: rgba(0,0,0,0.08);">
      <div class="flex-1 flex flex-col items-center py-4 px-4 text-center">
        <span class="text-2xl mb-1">🕐</span>
        <span class="text-xs font-bold uppercase tracking-wide mb-1"
              style="color: var(--color-primary-burgundy);">Open</span>
        <span class="text-sm" style="color: var(--color-text-dark);">Hele dag &amp; avond</span>
      </div>
      <div class="flex-1 flex flex-col items-center py-4 px-4 text-center">
        <span class="text-2xl mb-1">📍</span>
        <span class="text-xs font-bold uppercase tracking-wide mb-1"
              style="color: var(--color-primary-burgundy);">Locatie</span>
        <span class="text-sm" style="color: var(--color-text-dark);">
          {{ $r.adres }}, {{ $r.stad }}
        </span>
      </div>
      <div class="flex-1 flex flex-col items-center py-4 px-4 text-center">
        <span class="text-2xl mb-1">📞</span>
        <span class="text-xs font-bold uppercase tracking-wide mb-1"
              style="color: var(--color-primary-burgundy);">Reserveer</span>
        <a href="tel:{{ $r.telefoon }}" class="text-sm font-bold"
           style="color: var(--color-primary-burgundy);">
          {{ $r.telefoon }}
        </a>
      </div>
    </div>
  </div>

  <div class="flex-shrink-0 py-4" style="background: var(--color-primary-burgundy);">
    <div class="max-w-screen-xl mx-auto px-6">
      <p class="text-xs font-bold uppercase tracking-widest mb-3"
         style="color: rgba(205,182,132,0.5);">
        📸 <a href="{{ $r.instagram_url }}" target="_blank" rel="noopener"
               style="color: rgba(205,182,132,0.5);">@{{ $r.instagram_handle }}</a>
      </p>
      <div class="grid grid-cols-3 gap-2">
        <a href="{{ $r.instagram_url }}" target="_blank" rel="noopener" class="block overflow-hidden rounded aspect-square">
          <img src="/images/instagram/post1.jpg" alt="West op Instagram" class="w-full h-full object-cover hover:scale-105 transition-transform duration-300" />
        </a>
        <a href="{{ $r.instagram_url }}" target="_blank" rel="noopener" class="block overflow-hidden rounded aspect-square">
          <img src="/images/instagram/post2.jpg" alt="West op Instagram" class="w-full h-full object-cover hover:scale-105 transition-transform duration-300" />
        </a>
        <a href="{{ $r.instagram_url }}" target="_blank" rel="noopener" class="block overflow-hidden rounded aspect-square">
          <img src="/images/instagram/post3.jpg" alt="West op Instagram" class="w-full h-full object-cover hover:scale-105 transition-transform duration-300" />
        </a>
      </div>
    </div>
  </div>

</section>
